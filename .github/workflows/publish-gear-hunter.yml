name: Publish Gear Hunter addon release
on:
  push:
    branches: [main]
    paths:
      - 'GearHunter/**'
      - '.github/workflows/publish-gear-hunter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-GearHunter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4

      - name: Check completeness and version
        shell: bash
        run: |
          set -euo pipefail
          addon="GearHunter"
          toc="$addon/$addon.toc"
          test -f "$toc"
          version="$(sed -nE 's/^## Version:[[:space:]]*([^[:space:]]+).*/\1/p' "$toc" | head -1 | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid ## Version in $toc"; exit 1; }
          count="$(find "$addon" -type f | wc -l)"
          if [ "$count" -lt 186 ]; then
            echo "Refusing release: only $count files in $addon (require 186 or more). Upload the complete addon source first."
            exit 1
          fi
          tga_count="$(find "$addon/Art" -type f -name '*.tga' | wc -l)"
          [ "$tga_count" -eq 157 ] || { echo "Artwork incomplete: expected 157 TGA files; found $tga_count"; exit 1; }
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in
              *.lua|*.xml)
                test -f "$addon/$file" || { echo "Missing TOC-listed file: $addon/$file"; exit 1; }
                ;;
            esac
          done < "$toc"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Validated $count addon files for version $version"

      - name: Package complete addon folder
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -qr "$RUNNER_TEMP/GearHunter-$TAG.zip" "GearHunter/"
          (cd "$RUNNER_TEMP" && sha256sum "GearHunter-$TAG.zip" > "GearHunter-$TAG.zip.sha256")
          unzip -tq "$RUNNER_TEMP/GearHunter-$TAG.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the addon TOC version for the next update."
            exit 1
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/GearHunter-$TAG.zip" \
            "$RUNNER_TEMP/GearHunter-$TAG.zip.sha256" \
            --title "Gear Hunter $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Release published: $TAG"
